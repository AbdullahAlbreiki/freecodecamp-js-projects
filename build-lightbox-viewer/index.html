<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightbox Viewer</title>
    <link rel="stylesheet" href="styles.css"/>
  </head>

  <body>
    <div class="container">
        <header>
          <h1>Scenery Gallery</h1>
          <h3>Pick an Image</h3>
        </header>
        
        <div class="gallery">
            <img class="gallery-item" src="https://cdn.freecodecamp.org/curriculum/labs/stonehenge-thumbnail.jpg" alt="Stonehenge">
            <img class="gallery-item" src="https://cdn.freecodecamp.org/curriculum/labs/storm-thumbnail.jpg" alt="Storm">
            <img class="gallery-item" src="https://cdn.freecodecamp.org/curriculum/labs/trees-thumbnail.jpg" alt="Trees">
        </div>
        
        <div class="lightbox">
            <div class="lightbox-content">
                <button id="close-btn">&times;</button>
                <img id="lightbox-image" src="https://cdn.freecodecamp.org/curriculum/labs/stonehenge-thumbnail.jpg" alt="">
            </div>
        </div>

        <script src="script.js"></script>
        
        <footer>
          <p>Made by Abdullah Alburaiki :) following freeCodeCamp Full Stack Developer curriculum</p>
        </footer>
    </div>
  </body>

</html>
